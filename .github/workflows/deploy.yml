name: deploy

# Builds the three images on every push to main and publishes them to ghcr.io
# (public, like the repo). The deploy job then ssh's to the server and runs
# deploy.sh at this commit's sha — but only once the DEPLOY_SSH_KEY secret
# exists; until then deploy by hand: `ssh root@tolk-1 'cd /opt/bandroom && git pull && bash deploy/deploy.sh <sha>'`.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    # tolk-1 is a Hetzner CAX (Ampere, arm64). GitHub's arm runners are free for
    # public repos, so the images are built natively — no qemu.
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - name: api
            context: .
            file: Dockerfile
          - name: web
            context: .
            file: apps/web/Dockerfile
          - name: worker
            context: worker
            file: worker/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/lassenorby1/bandroom/${{ matrix.name }}:latest
            ghcr.io/lassenorby1/bandroom/${{ matrix.name }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.bandroom.io
            NEXT_PUBLIC_HUB_URL=https://api.bandroom.io/hubs/band
            NEXT_PUBLIC_SITE_URL=https://bandroom.io
            NEXT_PUBLIC_GOATCOUNTER=${{ vars.GOATCOUNTER_CODE }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # `secrets` isn't allowed in a job-level `if`, so a tiny job turns "is the
  # deploy key configured?" into an output the deploy job can gate on.
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: echo "enabled=${{ secrets.DEPLOY_SSH_KEY != '' }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [images, gate]
    runs-on: ubuntu-latest
    if: needs.gate.outputs.enabled == 'true'
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/bandroom && git pull --ff-only
            bash deploy/deploy.sh ${{ github.sha }}
