services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bandroom
      POSTGRES_USER: bandroom
      POSTGRES_PASSWORD: bandroom_dev
    ports:
      # 5433 on the host: something on this machine (wsl relay) already owns 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bandroom -d bandroom"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage. RustFS (apache-2.0, amd64 + arm64) replaced
  # minio when minio withdrew its community images in 2026. The service keeps
  # the name `minio` so Storage:WorkerEndpoint and the worker's urls don't move.
  # Bucket cors is set by the api at startup (Storage:AllowedOrigins).
  minio:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: bandroom
      RUSTFS_SECRET_KEY: bandroom_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || wget -qO- http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: ./worker
    ports:
      - "8090:8090"
    environment:
      HF_HOME: /models
      TORCH_HOME: /models/torch
      WHISPER_MODEL: base
    volumes:
      - worker-models:/models

volumes:
  postgres-data:
  minio-data:
  worker-models:
