services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bandroom
      POSTGRES_USER: bandroom
      POSTGRES_PASSWORD: bandroom_dev
    ports:
      # 5433 on the host: something on this machine (wsl relay) already owns 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bandroom -d bandroom"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bandroom
      MINIO_ROOT_PASSWORD: bandroom_dev
      # Browser uploads/streams go straight to storage — allow the web origin.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  worker:
    build: ./worker
    ports:
      - "8090:8090"

volumes:
  postgres-data:
  minio-data:
